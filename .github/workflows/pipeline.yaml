name: Pipeline CI

on: 
  push: 
    branches:
      - master

jobs: 
  test_and_build: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Code
      - uses: actions/checkout@v7

      - name: Install Node.js
      - uses: actions/setup-node@v7
        with: 
          node-version: 24
      
      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run build
        run: npm run build

